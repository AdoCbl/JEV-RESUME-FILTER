name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      # The page is the part a person touches, and substring assertions cannot see a broken
      # one. Without a browser here, tests/test_browser.py skips and CI is green about a page
      # it never loaded.
      - name: Install Chromium for the page tests
        run: uv run playwright install --with-deps chromium

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest --cov=polisher --cov-report=term-missing --cov-fail-under=80
