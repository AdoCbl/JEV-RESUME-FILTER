name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep the browser-test runtime explicit: Playwright and any JS syntax checks should
      # run against the same Node major in CI and on a developer machine.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      # The page is the part a person touches, and substring assertions cannot see a broken
      # one. Without a browser here, tests/test_browser.py skips and CI is green about a page
      # it never loaded.
      - name: Install Chromium for the page tests
        run: uv run playwright install --with-deps chromium

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest --cov=polisher --cov-report=term-missing --cov-fail-under=80

      # The docs and the batch index tell a person to run `resume-polisher`. A virtual project
      # skips that entry point with only a warning, so build the wheel and run the command
      # from it, in a venv that has nothing else in it.
      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Check the installed command
        run: |
          uv venv /tmp/installed --python 3.14
          uv pip install --python /tmp/installed/bin/python dist/*.whl
          /tmp/installed/bin/resume-polisher --help
